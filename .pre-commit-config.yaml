# Pre-commit-Hooks laufen automatisch vor jedem "git commit".
# Einrichten:  pre-commit install
# Manuell auf alle Dateien anwenden:  pre-commit run --all-files
#
# Idee dahinter: Fehler werden schon lokal abgefangen, bevor sie in die
# Pipeline gelangen. Genau dieselben Checks laufen dann nochmal in CI.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.10
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
