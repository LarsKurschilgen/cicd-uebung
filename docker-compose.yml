# Startet die App lokal mit einem einzigen Befehl:  docker compose up
# Praktisch, um später weitere Dienste (z. B. eine echte Datenbank) zu ergänzen.
services:
  api:
    build: .
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped
