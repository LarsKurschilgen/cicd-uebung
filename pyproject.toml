[project]
name = "task-manager"
version = "0.1.0"
description = "Übungsprojekt für CI/CD mit GitHub Actions"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",          # wird vom FastAPI-TestClient benötigt
    "ruff>=0.4",
    "black>=24.0",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

# ---------------------------------------------------------------------------
# pytest: Testerkennung und Coverage-Optionen
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"

# ---------------------------------------------------------------------------
# Coverage: Was wird gemessen, und ab wann gilt der Build als "zu wenig getestet"?
# fail_under erzwingt ein Mindest-Coverage – ein zentrales CI/CD-Konzept ("Quality Gate").
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

# ---------------------------------------------------------------------------
# Ruff: schneller Linter (ersetzt flake8, isort u.v.m.)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
# E/F = pyflakes+pycodestyle, I = isort, UP = pyupgrade,
# B = bugbear, SIM = simplify, C4 = comprehensions
ignore = [
    "UP017",  # datetime.UTC statt timezone.utc – wir bleiben bewusst kompatibel
    "UP042",  # StrEnum statt (str, Enum) – (str, Enum) ist breiter unterstützt
]

# ---------------------------------------------------------------------------
# Black: Code-Formatter
# ---------------------------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py311"]

# ---------------------------------------------------------------------------
# mypy: statische Typprüfung
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_return_any = true
ignore_missing_imports = true
